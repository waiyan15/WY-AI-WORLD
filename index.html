<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WY AI Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .app-container { width: 100%; max-width: 440px; height: 840px; background: #111827; border: 1px solid #1f293d; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.7); }
    .header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; }
    .brand-section { display: flex; align-items: center; gap: 10px; }
    .brand-badge { width: 40px; height: 40px; background: #0f172a; border: 1.5px solid #0095ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #38bdf8; font-size: 16px; box-shadow: 0 0 12px rgba(0,149,255,0.35); }
    .brand-title { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tab-content { flex: 1; padding: 14px; display: none; flex-direction: column; overflow-y: auto; gap: 12px; }
    .tab-content.active { display: flex; }
    .card { background: #151d2e; border: 1px solid #1e293b; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .key-input { background: #0b101a; border: 1px solid #334155; padding: 8px 12px; border-radius: 10px; color: #38bdf8; font-size: 12px; width: 100%; outline: none; }
    .input-area { width: 100%; height: 90px; background: transparent; border: none; outline: none; color: #cbd5e1; font-size: 13px; line-height: 1.6; resize: none; }
    .btn-action { background: #0284c7; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: #0369a1; }
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .file-uploader { border: 1.5px dashed #38bdf8; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; background: rgba(56, 189, 248, 0.03); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .file-uploader input { display: none; }
    .style-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #94a3b8; }
    .color-picker { border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; background: none; }
    .video-preview-box { width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; }
    video, canvas { max-width: 100%; max-height: 180px; }
    .progress-bar { width: 100%; background-color: #1e293b; border-radius: 8px; height: 6px; overflow: hidden; display: none; }
    .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.3s; }
    .bottom-nav { height: 64px; background: #0b101a; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; font-size: 10.5px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
    .nav-item.active { color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="brand-section">
        <div class="brand-badge">WY</div>
        <div class="brand-title">WY AI Studio</div>
      </div>
      <span style="font-size: 11px; color: #10b981;"><i class="fa-solid fa-bolt"></i> Auto Video Studio</span>
    </div>

    <!-- API Key Input (Persisted) -->
    <div style="padding: 10px 14px 0 14px;">
      <input type="password" id="geminiApiKey" class="key-input" placeholder="🔑 Gemini API Key ထည့်ပါ (Auto-saved)" onchange="saveApiKey()">
    </div>

    <!-- MAIN TAB: Video AI Recap & Subtitle Burner -->
    <div class="tab-content active" id="tab-video-pro">
      
      <!-- Step 1: Video Upload & Preview -->
      <div class="card">
        <label class="file-uploader" for="videoInput">
          <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; color: #38bdf8;"></i>
          <span id="videoStatus" style="font-size: 12.5px; color: #cbd5e1;">ဗီဒီယိုဖိုင် ရွေးချယ်ပါ (MP4, WEBM)</span>
          <input type="file" id="videoInput" accept="video/*" onchange="loadVideo(event)">
        </label>
        
        <div class="video-preview-box" id="previewContainer" style="display:none;">
          <video id="sourceVideo" playsinline controls></video>
          <canvas id="renderCanvas" style="display: none;"></canvas>
        </div>
      </div>

      <!-- Step 2: Auto Recap & Subtitle Generation -->
      <div class="card">
        <span style="font-size: 12px; color: #94a3b8;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Video Recap & Subtitle Generator</span>
        <button class="btn-action" id="btnGenRecap" onclick="generateVideoRecap()" disabled style="opacity:0.6;">
          <i class="fa-solid fa-brain"></i> ဗီဒီယိုမှ မြန်မာ Recap & စာတန်း Auto ထုတ်မည်
        </button>

        <textarea class="input-area" id="recapText" placeholder="AI မှ ထုတ်ပေးမည့် မြန်မာ Recap စာတန်းကို ဤနေရာတွင် ပြင်ဆင်နိုင်ပါသည်..."></textarea>
        
        <div style="display: flex; gap: 8px;">
          <button class="btn-action btn-secondary" style="flex:1;" onclick="playBurmeseTTS()">
            <i class="fa-solid fa-volume-high"></i> TTS အသံစမ်းဖွင့်မည်
          </button>
          <button class="btn-action btn-secondary" onclick="stopBurmeseTTS()">
            <i class="fa-solid fa-stop"></i>
          </button>
        </div>
      </div>

      <!-- Step 3: Subtitle Styling & Video Export -->
      <div class="card">
        <span style="font-size: 12px; color: #94a3b8;"><i class="fa-solid fa-palette"></i> စာတန်းအရောင်နှင့် Video Download</span>
        <div class="style-row">
          <span>စာသားအရောင်:</span>
          <input type="color" id="subTextColor" class="color-picker" value="#ffff00">
          <span>နောက်ခံအရောင်:</span>
          <input type="color" id="subBgColor" class="color-picker" value="#000000">
        </div>

        <div class="progress-bar" id="exportProgress"><div class="progress-fill" id="exportFill"></div></div>

        <button class="btn-action btn-success" id="btnExportVideo" onclick="renderAndDownloadVideo()" disabled style="opacity:0.6;">
          <i class="fa-solid fa-file-video"></i> စာတန်းပါ ဗီဒီယိုသစ် Download ဆွဲမည်
        </button>
      </div>
    </div>

    <!-- TAB 2: Standalone SRT 250 Batch (Preserved) -->
    <div class="tab-content" id="tab-srt">
      <div class="card">
        <span style="font-size: 12px; color: #94a3b8;"><i class="fa-solid fa-closed-captioning"></i> SRT Translator (စာကြောင်း ၂၅၀ ထိ)</span>
        <label class="file-uploader" for="srtFileInput">
          <i class="fa-solid fa-file-arrow-up" style="font-size: 22px; color: #38bdf8;"></i>
          <span id="srtNameDisplay" style="font-size: 12.5px; color: #cbd5e1;">.srt ဖိုင် ရွေးချယ်ပါ</span>
          <input type="file" id="srtFileInput" accept=".srt" onchange="handleSRTSelect(event)">
        </label>
        <button class="btn-action" id="btnSRTTrans" onclick="translateRawSRT()" disabled style="opacity:0.6;">
          <i class="fa-solid fa-language"></i> စာတန်းထိုး ၂၅၀ အပြည့် ပြောင်းမည်
        </button>
        <button class="btn-action btn-secondary" id="btnDownloadSrt" onclick="downloadSrtOnly()" style="display:none;">
          <i class="fa-solid fa-download"></i> .srt ဖိုင် ရယူမည်
        </button>
      </div>
      <div id="srtLog" style="background:#0a0e17; border:1px solid #1f2937; border-radius:12px; padding:10px; font-family:monospace; font-size:11px; color:#38bdf8; height:180px; overflow-y:auto; white-space:pre-wrap;">SRT ဖိုင် အချက်အလက်များ...</div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-video-pro', this)">
        <i class="fa-solid fa-clapperboard"></i>
        <span>Video Auto Recap</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-srt', this)">
        <i class="fa-solid fa-file-lines"></i>
        <span>SRT ဘာသာပြန် (၂၅၀)</span>
      </div>
    </div>
  </div>

  <audio id="ttsAudio" style="display: none;"></audio>

  <script>
    let videoBlob = null;
    let videoBase64 = "";
    let mediaRecorder = null;
    let recordedChunks = [];
    let rawSRT = "";
    let finalTranslatedSRT = "";

    window.onload = function() {
      const savedKey = localStorage.getItem('wy_gemini_key');
      if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
    };

    function saveApiKey() {
      localStorage.setItem('wy_gemini_key', document.getElementById('geminiApiKey').value.trim());
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    // 1. VIDEO LOAD
    function loadVideo(e) {
      const file = e.target.files[0];
      if (!file) return;
      videoBlob = file;
      document.getElementById('videoStatus').textContent = file.name;
      
      const v = document.getElementById('sourceVideo');
      v.src = URL.createObjectURL(file);
      document.getElementById('previewContainer').style.display = "flex";

      const reader = new FileReader();
      reader.onload = function(evt) {
        videoBase64 = evt.target.result.split(',')[1];
        const btnRecap = document.getElementById('btnGenRecap');
        btnRecap.disabled = false; btnRecap.style.opacity = "1";
      };
      reader.readAsDataURL(file);
    }

    // 2. VIDEO TO BURMESE RECAP
    async function generateVideoRecap() {
      const apiKey = document.getElementById('geminiApiKey').value.trim();
      if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါ");
      if (!videoBase64) return alert("ဗီဒီယို အရင်ရွေးချယ်ပါ");

      const txtArea = document.getElementById('recapText');
      txtArea.value = "AI မှ ဗီဒီယိုအသံကို နားထောင်ပြီး သဘာဝကျသော မြန်မာ Recap စာတန်းကို ထုတ်လုပ်နေပါသည် (ခဏစောင့်ပါ)...";

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inline_data: { mime_type: "audio/mp3", data: videoBase64 } },
                { text: "Listen to the video speech and generate an engaging, exciting video recap in fluent Burmese (မြန်မာလို စိတ်ဝင်စားဖွယ် ဗီဒီယိုဇာတ်လမ်းအကျဉ်းချုပ် စာတန်းတိုလေးများ). Return only clean Burmese recap sentences suitable for subtitle overlay." }
              ]
            }]
          })
        });
        const data = await res.json();
        const text = data.candidates[0].content.parts[0].text;
        txtArea.value = text;
        const btnExport = document.getElementById('btnExportVideo');
        btnExport.disabled = false; btnExport.style.opacity = "1";
      } catch (e) {
        txtArea.value = "Recap ထုတ်လုပ်မှု အဆင်မပြေပါ။ ဖိုင်အရွယ်အစား သေးငယ်သော ဗီဒီယိုဖြင့် ပြန်လည်စမ်းသပ်ပေးပါ။";
      }
    }

    // 3. BURMESE TTS (AUDIO ENGINE)
    function playBurmeseTTS() {
      const text = document.getElementById('recapText').value.trim();
      if (!text) return alert("ဖတ်ပြရန် စာသားမရှိပါ");
      const audio = document.getElementById('ttsAudio');
      audio.src = `https://translate.google.com.vn/translate_tts?ie=UTF-8&q=${encodeURIComponent(text.substring(0, 150))}&tl=my&client=tw-ob`;
      audio.play().catch(() => {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'my-MM';
        window.speechSynthesis.speak(utter);
      });
    }

    function stopBurmeseTTS() {
      document.getElementById('ttsAudio').pause();
      window.speechSynthesis.cancel();
    }

    // 4. CANVAS HARDCODE SUBTITLE & VIDEO DOWNLOAD
    async function renderAndDownloadVideo() {
      const video = document.getElementById('sourceVideo');
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      const text = document.getElementById('recapText').value.trim();
      const textColor = document.getElementById('subTextColor').value;
      const bgColor = document.getElementById('subBgColor').value;
      const progressBox = document.getElementById('exportProgress');
      const progressFill = document.getElementById('exportFill');

      if (!text) return alert("စာတန်းထိုးရန် Recap စာသားမရှိပါ");

      progressBox.style.display = "block";
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 360;

      const stream = canvas.captureStream(30);
      
      // Combine with audio track from original video
      const audioTracks = video.captureStream ? video.captureStream().getAudioTracks() : [];
      if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'WY_AI_Recap_Subtitled.webm';
        a.click();
        progressBox.style.display = "none";
        alert("စာတန်းထိုး ဗီဒီယိုအသစ် ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ!");
      };

      mediaRecorder.start();
      video.currentTime = 0;
      await video.play();

      function drawFrame() {
        if (video.paused || video.ended) {
          mediaRecorder.stop();
          return;
        }

        // Draw original video frame
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Draw Subtitle Box
        const fontSize = Math.max(16, Math.floor(canvas.width / 26));
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center";

        const textY = canvas.height - 40;
        const textMetrics = ctx.measureText(text.substring(0, 40));
        
        // Background banner
        ctx.fillStyle = bgColor;
        ctx.globalAlpha = 0.75;
        ctx.fillRect((canvas.width - textMetrics.width) / 2 - 12, textY - fontSize, textMetrics.width + 24, fontSize + 16);

        // Subtitle Text
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = textColor;
        ctx.fillText(text.substring(0, 40), canvas.width / 2, textY);

        // Progress bar
        const pct = Math.round((video.currentTime / video.duration) * 100);
        progressFill.style.width = `${pct}%`;

        requestAnimationFrame(drawFrame);
      }
      drawFrame();
    }

    // 5. STANDALONE SRT 250 (PRESERVED)
    function handleSRTSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('srtNameDisplay').textContent = file.name;
      const reader = new FileReader();
      reader.onload = ev => {
        rawSRT = ev.target.result;
        const b = document.getElementById('btnSRTTrans');
        b.disabled = false; b.style.opacity = "1";
      };
      reader.readAsText(file);
    }

    async function translateRawSRT() {
      const apiKey = document.getElementById('geminiApiKey').value.trim();
      if (!apiKey || !rawSRT) return alert("API Key နှင့် SRT ဖိုင် ထည့်ပါ");

      const log = document.getElementById('srtLog');
      log.textContent = "စာကြောင်း ၂၅၀ ကို AI ဖြင့် စတင်ဘာသာပြန်နေပါသည်...";

      const blocks = rawSRT.trim().replace(/\r\n/g, '\n').split(/\n\n+/);
      const total = Math.min(blocks.length, 250);
      let out = [];

      for (let i = 0; i < total; i += 25) {
        const batch = blocks.slice(i, Math.min(i + 25, total));
        let items = [];
        batch.forEach(b => {
          const l = b.split('\n');
          if (l.length >= 3) items.push({ id: l[0], time: l[1], text: l.slice(2).join(' ') });
        });

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Translate subtitles to conversational natural Burmese strictly in JSON format array with id, time, text:\n${JSON.stringify(items)}` }] }]
            })
          });
          const d = await res.json();
          const clean = d.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
          JSON.parse(clean).forEach(it => out.push(`${it.id}\n${it.time}\n${it.text}`));
        } catch (err) {
          batch.forEach(b => out.push(b));
        }
      }

      finalTranslatedSRT = out.join('\n\n');
      log.textContent = "ဘာသာပြန်ပြီးပါပြီ!\n\n" + finalTranslatedSRT;
      document.getElementById('btnDownloadSrt').style.display = "flex";
    }

    function downloadSrtOnly() {
      const blob = new Blob([finalTranslatedSRT], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'burmese_250.srt'; a.click();
    }
  </script>
</body>
</html>
