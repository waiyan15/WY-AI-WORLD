<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WY AI Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 780px;
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      background: #0f172a;
      border: 1.5px solid #0095ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #38bdf8;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(0, 149, 255, 0.35);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tab-content {
      flex: 1;
      padding: 16px;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background: #151d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-area {
      width: 100%;
      height: 120px;
      background: transparent;
      border: none;
      outline: none;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }

    .btn-action {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-action:hover {
      background: #0369a1;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .file-uploader {
      border: 1.5px dashed #38bdf8;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      background: rgba(56, 189, 248, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .file-uploader input {
      display: none;
    }

    .progress-bar {
      width: 100%;
      background-color: #1e293b;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.3s;
    }

    .srt-box {
      background: #0a0e17;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 11.5px;
      color: #38bdf8;
      height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .bottom-nav {
      height: 64px;
      background: #0b101a;
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748b;
      font-size: 11px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .nav-item.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="brand-section">
        <div class="brand-badge">WY</div>
        <div class="brand-title">WY AI Studio</div>
      </div>
      <span style="font-size: 12px; color: #10b981;"><i class="fa-solid fa-circle-check"></i> Pro Mode</span>
    </div>

    <!-- TAB 1: SRT Translate Engine (စာကြောင်း ၂၀၀ Auto Translator) -->
    <div class="tab-content active" id="tab-srt-trans">
      <div class="card">
        <span style="font-size: 13px; color: #94a3b8;"><i class="fa-solid fa-language"></i> SRT Auto-Translator (စာကြောင်း ၂၀၀ ထိ ဘာသာပြန်နိုင်သည်)</span>
        
        <label class="file-uploader" for="srtFileInput">
          <i class="fa-solid fa-file-arrow-up" style="font-size: 26px; color: #38bdf8;"></i>
          <span id="fileNameDisplay" style="font-size: 13px; color: #cbd5e1;">မူရင်း .srt ဖိုင် ရွေးချယ်ပါ (သို့မဟုတ် နှိပ်ပါ)</span>
          <input type="file" id="srtFileInput" accept=".srt" onchange="handleFileSelect(event)">
        </label>

        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="btn-action" id="btnTranslate" onclick="processAndTranslateSRT()" disabled style="opacity: 0.6;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> မြန်မာစာတန်းထိုး အဖြစ် ဘာသာပြန်မည်
        </button>

        <button class="btn-action btn-secondary" id="btnDownload" onclick="downloadTranslatedSRT()" style="display: none;">
          <i class="fa-solid fa-download"></i> မြန်မာ .srt ဖိုင် ဒေါင်းလုဒ်ဆွဲမည်
        </button>
      </div>

      <div class="srt-box" id="srtLog">ဘာသာပြန်ပြီးသား စာတန်းထိုးများကို ဤနေရာတွင် တိုက်ရိုက် ကြည့်ရှုနိုင်ပါမည်...</div>
    </div>

    <!-- TAB 2: Voice Maker -->
    <div class="tab-content" id="tab-voice">
      <div class="card" style="flex:1;">
        <span style="font-size: 13px; color: #94a3b8;"><i class="fa-solid fa-volume-high"></i> အသံဖန်တီးခြင်း (Text to Speech)</span>
        <textarea class="input-area" id="voiceText" placeholder="ဖတ်ပြစေလိုသော စာသားကို ရိုက်ထည့်ပါ...">မင်္ဂလာပါ WY AI Studio မှ ကြိုဆိုပါတယ်။</textarea>
        
        <div style="display:flex; gap: 8px;">
          <button class="btn-action" style="flex:1;" onclick="playVoice()">
            <i class="fa-solid fa-play"></i> အသံဖွင့်ရန်
          </button>
          <button class="btn-action btn-secondary" onclick="window.speechSynthesis.cancel()">
            <i class="fa-solid fa-stop"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-srt-trans', this)">
        <i class="fa-solid fa-closed-captioning"></i>
        <span>SRT ဘာသာပြန်</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-voice', this)">
        <i class="fa-solid fa-volume-high"></i>
        <span>အသံထုတ်စနစ်</span>
      </div>
    </div>
  </div>

  <script>
    let rawSRTText = "";
    let finalTranslatedSRT = "";

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    // 1. File Upload Logic
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').textContent = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        rawSRTText = e.target.result;
        const btn = document.getElementById('btnTranslate');
        btn.disabled = false;
        btn.style.opacity = "1";
        document.getElementById('srtLog').textContent = `ဖိုင်ဖတ်ပြီးပါပြီ။ စာကြောင်းများကို ဘာသာပြန်ရန် အသင့်ဖြစ်နေပါပြီ...\n\nမူရင်းအစအကြမ်း:\n` + rawSRTText.substring(0, 200) + "...";
      };
      reader.readAsText(file);
    }

    // 2. SRT Parsing & Translation Engine (Up to 200 Subtitles)
    async function processAndTranslateSRT() {
      if (!rawSRTText) return alert("ကျေးဇူးပြု၍ .srt ဖိုင် အရင်ထည့်သွင်းပေးပါ");

      const logBox = document.getElementById('srtLog');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      const btnTranslate = document.getElementById('btnTranslate');
      const btnDownload = document.getElementById('btnDownload');

      progressBar.style.display = "block";
      btnTranslate.disabled = true;
      logBox.textContent = "ဘာသာပြန်ခြင်း စတင်နေပါပြီ...\n";

      // Split SRT Blocks
      const blocks = rawSRTText.trim().replace(/\r\n/g, '\n').split(/\n\n+/);
      const totalBlocks = Math.min(blocks.length, 200); // Limit to 200 lines
      let translatedBlocks = [];

      for (let i = 0; i < totalBlocks; i++) {
        const lines = blocks[i].split('\n');
        if (lines.length >= 3) {
          const indexNum = lines[0];
          const timeCode = lines[1];
          const originalText = lines.slice(2).join(' ');

          // Translate Subtitle Line
          try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(originalText)}&langpair=autodetect|my`);
            const data = await res.json();
            const translatedText = (data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : originalText;

            translatedBlocks.push(`${indexNum}\n${timeCode}\n${translatedText}`);
            logBox.textContent = `[${i + 1}/${totalBlocks}] ပြောင်းလဲပြီး: ${translatedText}\n` + logBox.textContent;
          } catch (e) {
            translatedBlocks.push(blocks[i]); // Fallback to original
          }
        } else {
          translatedBlocks.push(blocks[i]);
        }

        // Update Progress Bar
        const percent = Math.round(((i + 1) / totalBlocks) * 100);
        progressFill.style.width = `${percent}%`;
        
        // Small delay to prevent API rate limit
        await new Promise(resolve => setTimeout(resolve, 150));
      }

      finalTranslatedSRT = translatedBlocks.join('\n\n');
      logBox.textContent = "အကုန်လုံး မြန်မာဘာသာသို့ အောင်မြင်စွာ ပြောင်းလဲပြီးပါပြီ!\n\n" + finalTranslatedSRT;
      btnDownload.style.display = "flex";
      btnTranslate.disabled = false;
    }

    // 3. Download Translated SRT
    function downloadTranslatedSRT() {
      if (!finalTranslatedSRT) return alert("ဒေါင်းလုဒ်ဆွဲရန် စာတန်းထိုး မရှိသေးပါ");
      const blob = new Blob([finalTranslatedSRT], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'burmese_subtitles.srt';
      link.click();
    }

    // 4. Voice TTS Engine
    function playVoice() {
      const text = document.getElementById('voiceText').value;
      if (!text.trim()) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
