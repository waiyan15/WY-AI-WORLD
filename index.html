<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WY AI Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 760px;
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      background: #0f172a;
      border: 1.5px solid #0095ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #38bdf8;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(0, 149, 255, 0.35);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tab-content {
      flex: 1;
      padding: 16px;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      gap: 14px;
    }

    .tab-content.active {
      display: flex;
    }

    .card {
      background: #151d2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-area {
      width: 100%;
      height: 140px;
      background: transparent;
      border: none;
      outline: none;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }

    .btn-action {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-action:hover {
      background: #0369a1;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .srt-box {
      background: #0a0e17;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: 64px;
      background: #0b101a;
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748b;
      font-size: 11px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .nav-item.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="brand-section">
        <div class="brand-badge">WY</div>
        <div class="brand-title">WY AI Studio</div>
      </div>
      <span style="font-size: 12px; color: #10b981;"><i class="fa-solid fa-circle-check"></i> Ready</span>
    </div>

    <!-- TAB 1: Real Voice Player (TTS) -->
    <div class="tab-content active" id="tab-voice">
      <div class="card" style="flex:1;">
        <span style="font-size: 13px; color: #94a3b8;"><i class="fa-solid fa-volume-high"></i> အသံဖန်တီးခြင်း (Text to Speech)</span>
        <textarea class="input-area" id="voiceText" placeholder="ဖတ်ပြစေလိုသော စာသားကို ရိုက်ထည့်ပါ (English/Burmese)...">မင်္ဂလာပါ WY AI Studio မှ ကြိုဆိုပါတယ်။</textarea>
        
        <div style="display:flex; gap: 8px;">
          <button class="btn-action" style="flex:1;" onclick="playVoice()">
            <i class="fa-solid fa-play"></i> အသံဖွင့်ရန်
          </button>
          <button class="btn-action btn-secondary" onclick="stopVoice()">
            <i class="fa-solid fa-stop"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: Real SRT Generator & Downloader -->
    <div class="tab-content" id="tab-srt">
      <div class="card">
        <span style="font-size: 13px; color: #94a3b8;"><i class="fa-regular fa-closed-captioning"></i> SRT ဖန်တီးပြီး Download ပြုလုပ်ရန်</span>
        <input type="text" id="srtLine1" style="background:#0b101a; border:1px solid #334155; padding:8px; border-radius:8px; color:white;" value="မင်္ဂလာပါ မိတ်ဆွေ">
        <input type="text" id="srtLine2" style="background:#0b101a; border:1px solid #334155; padding:8px; border-radius:8px; color:white;" value="ဒီနေ့ ဗီဒီယိုလေးကို စတင်လိုက်ကြရအောင်">
        <button class="btn-action" onclick="generateSRT()">
          <i class="fa-solid fa-file-arrow-down"></i> .srt ဖိုင် ထုတ်ယူမည်
        </button>
      </div>
      <div class="srt-box" id="srtDisplay">SRT ဖိုင် အကြမ်းကို ဤနေရာတွင် ပြသပေးပါမည်...</div>
    </div>

    <!-- TAB 3: Translate -->
    <div class="tab-content" id="tab-translate">
      <div class="card">
        <span style="font-size: 13px; color: #94a3b8;"><i class="fa-solid fa-globe"></i> အမြန် ဘာသာပြန်ကိရိယာ</span>
        <textarea class="input-area" id="translateInput" placeholder="ဘာသာပြန်လိုသော တရုတ် သို့မဟုတ် အင်္ဂလိပ်စာ ရိုက်ထည့်ပါ..."></textarea>
        <button class="btn-action" onclick="translateText()">
          <i class="fa-solid fa-language"></i> မြန်မာဘာသာသို့ ပြောင်းမည်
        </button>
      </div>
      <div class="card" style="flex:1;">
        <span style="font-size: 13px; color: #94a3b8;">ရလဒ် -</span>
        <p id="translateResult" style="font-size: 14px; line-height: 1.6; color: #38bdf8;">စာသား ရိုက်ထည့်ပြီး ပြောင်းလဲနိုင်ပါသည်။</p>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-voice', this)">
        <i class="fa-solid fa-volume-high"></i>
        <span>အသံထုတ်မည်</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-srt', this)">
        <i class="fa-regular fa-closed-captioning"></i>
        <span>SRT ဖိုင်</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-translate', this)">
        <i class="fa-solid fa-globe"></i>
        <span>Translate</span>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    // 1. Text-To-Speech Logic (တကယ့်အသံဖတ်ပေးသည့်စနစ်)
    function playVoice() {
      const text = document.getElementById('voiceText').value;
      if (!text.trim()) return alert("စာသား အရင်ရိုက်ထည့်ပေးပါ");
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function stopVoice() {
      window.speechSynthesis.cancel();
    }

    // 2. Real SRT Generator & Downloader (.srt ဖိုင် တကယ် download ဆွဲပေးသည့်စနစ်)
    function generateSRT() {
      const line1 = document.getElementById('srtLine1').value || "စာတန်းထိုး အပိုင်း ၁";
      const line2 = document.getElementById('srtLine2').value || "စာတန်းထိုး အပိုင်း ၂";

      const srtContent = 
`1
00:00:01,000 --> 00:00:03,500
${line1}

2
00:00:04,000 --> 00:00:07,000
${line2}`;

      document.getElementById('srtDisplay').textContent = srtContent;

      // File download trigger
      const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'subtitle.srt';
      link.click();
    }

    // 3. Simple Translate Logic
    async function translateText() {
      const text = document.getElementById('translateInput').value;
      const resBox = document.getElementById('translateResult');
      if (!text.trim()) return alert("ဘာသာပြန်မည့်စာ ရိုက်ထည့်ပါ");

      resBox.innerText = "ဘာသာပြန်နေပါသည်...";
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|my`);
        const data = await response.json();
        if (data.responseData && data.responseData.translatedText) {
          resBox.innerText = data.responseData.translatedText;
        } else {
          resBox.innerText = "ဘာသာပြန်ခြင်း မအောင်မြင်ပါ။ စာသားကို ပြန်စစ်ပေးပါ။";
        }
      } catch (err) {
        resBox.innerText = "အင်တာနက်ချိတ်ဆက်မှုကို စစ်ဆေးပေးပါ။";
      }
    }
  </script>
</body>
</html>
